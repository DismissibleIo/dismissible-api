name: PR Checks - Docker

on:
  pull_request:
    branches:
      - '**'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dismissible
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      dismissible-dynamodb:
        # Setup and tests use access key 'test' and region 'us-east-1' (no -sharedDb).
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 4566:8000

      redis:
        image: redis:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: dismissible-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: ./scripts/test-docker-image.sh --no-build dismissible-api

  test-compose-stack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test every backend in Docker Compose
        run: npm run test:compose
