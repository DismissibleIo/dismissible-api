# Redis cache enabled test config
# Point DISMISSIBLE_CACHE_REDIS_URL at a disposable Redis instance: these tests flush it.

server:
  port: 3001

cors:
  enabled: false

helmet:
  enabled: false

swagger:
  enabled: false

storage:
  type: memory

cache:
  type: redis
  redis:
    url: ${DISMISSIBLE_CACHE_REDIS_URL:-redis://localhost:6379}
    keyPrefix: 'test:'
    ttlMs: 60000

jwtAuth:
  enabled: false

rateLimiter:
  enabled: false

validation:
  disableErrorMessages: false
  whitelist: true
  forbidNonWhitelisted: true
  transform: true
