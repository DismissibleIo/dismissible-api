server:
  port: 3097

cors:
  enabled: false

helmet:
  enabled: false

swagger:
  enabled: false

storage:
  type: ${DISMISSIBLE_STORAGE_TYPE:-postgres}
  postgres:
    connectionString: postgresql://switch-user:switch-pass@localhost:5432/switch-db
  dynamodb:
    tableName: switch-table
    region: us-east-1
    endpoint: http://localhost:4566
    accessKeyId: test
    secretAccessKey: test

cache:
  type: ${DISMISSIBLE_CACHE_TYPE:-redis}
  redis:
    url: redis://switch-host:6379
    keyPrefix: 'switch:'
  memory:
    maxItems: 42
    ttlMs: 4200

jwtAuth:
  enabled: false

rateLimiter:
  enabled: false

validation:
  disableErrorMessages: false
  whitelist: true
  forbidNonWhitelisted: true
  transform: true

customFeature:
  featureName: switch-feature
