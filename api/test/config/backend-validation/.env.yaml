server:
  port: 3098

cors:
  enabled: false

helmet:
  enabled: false

swagger:
  enabled: false

# The postgres and redis sections are invalid, and dynamodb is missing, so the
# config is only valid while none of those backends are selected.
storage:
  type: ${DISMISSIBLE_STORAGE_TYPE:-memory}
  postgres:
    connectionString: 123

cache:
  type: ${DISMISSIBLE_CACHE_TYPE:-memory}
  redis:
    url: 123
  memory: {}

jwtAuth:
  enabled: false

rateLimiter:
  enabled: false

validation:
  disableErrorMessages: false
  whitelist: true
  forbidNonWhitelisted: true
  transform: true
