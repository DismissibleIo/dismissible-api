server:
  port: 3099

cors:
  enabled: false

helmet:
  enabled: false

swagger:
  enabled: false

storage:
  type: memory

# Neither the redis nor the memory section is present.
cache:
  type: ${DISMISSIBLE_CACHE_TYPE:-memory}

jwtAuth:
  enabled: false

rateLimiter:
  enabled: false

validation:
  disableErrorMessages: false
  whitelist: true
  forbidNonWhitelisted: true
  transform: true
