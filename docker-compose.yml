services:
  dismissible-api:
    build: .
    restart: unless-stopped
    depends_on:
      dismissible-postgres:
        condition: service_started
      dismissible-dynamodb:
        condition: service_healthy
      dismissible-redis:
        condition: service_started
    environment:
      # Server
      DISMISSIBLE_PORT: 3001
      DISMISSIBLE_SWAGGER_ENABLED: true

      # Storage Type
      DISMISSIBLE_STORAGE_TYPE: dynamodb

      # Postgres Storage
      DISMISSIBLE_STORAGE_POSTGRES_CONNECTION_STRING: postgresql://postgres:postgres@dismissible-postgres:5432/dismissible

      # DynamoDB Storage (DynamoDB Local)
      DISMISSIBLE_STORAGE_DYNAMODB_TABLE_NAME: dismissible-items
      DISMISSIBLE_STORAGE_DYNAMODB_AWS_REGION: us-east-1
      DISMISSIBLE_STORAGE_DYNAMODB_ENDPOINT: http://dismissible-dynamodb:4566
      DISMISSIBLE_STORAGE_DYNAMODB_AWS_ACCESS_KEY_ID: test
      DISMISSIBLE_STORAGE_DYNAMODB_AWS_SECRET_ACCESS_KEY: test

      # Cache Configuration
      # Set to 'redis' to enable Redis cache, 'memory' for memory cache, or leave empty for no cache
      DISMISSIBLE_CACHE_TYPE: redis
      # Redis Cache
      DISMISSIBLE_CACHE_REDIS_URL: redis://dismissible-redis:6379
      DISMISSIBLE_CACHE_REDIS_KEY_PREFIX: ''
      DISMISSIBLE_CACHE_REDIS_TTL_MS: ''
      DISMISSIBLE_CACHE_REDIS_ENABLE_READY_CHECK: ''
      DISMISSIBLE_CACHE_REDIS_MAX_RETRIES: ''
      # Memory Cache (used when DISMISSIBLE_CACHE_TYPE=memory)
      DISMISSIBLE_CACHE_MEMORY_MAX_ITEMS: ''
      DISMISSIBLE_CACHE_MEMORY_TTL_MS: ''

      # JWT Authentication (disabled for local development)
      DISMISSIBLE_JWT_AUTH_ENABLED: false
      # Uncomment and configure for production with your OIDC provider:
      # DISMISSIBLE_JWT_AUTH_ENABLED: true
      # DISMISSIBLE_JWT_AUTH_WELL_KNOWN_URL: https://your-tenant.auth0.com/.well-known/openid-configuration
      # DISMISSIBLE_JWT_AUTH_ISSUER: https://your-tenant.auth0.com/
      # DISMISSIBLE_JWT_AUTH_AUDIENCE: your-api-identifier
      # DISMISSIBLE_JWT_AUTH_MATCH_USER_ID: true
      # DISMISSIBLE_JWT_AUTH_USER_ID_CLAIM: sub
      # DISMISSIBLE_JWT_AUTH_USER_ID_MATCH_TYPE: exact
      # DISMISSIBLE_JWT_AUTH_USER_ID_MATCH_REGEX:

      # Security Headers (Helmet)
      DISMISSIBLE_HELMET_ENABLED: true
      DISMISSIBLE_HELMET_CSP: false
      DISMISSIBLE_HELMET_COEP: false
      DISMISSIBLE_HELMET_HSTS_MAX_AGE: 31536000
      DISMISSIBLE_HELMET_HSTS_INCLUDE_SUBDOMAINS: true
      DISMISSIBLE_HELMET_HSTS_PRELOAD: false

      # CORS
      DISMISSIBLE_CORS_ENABLED: true
      DISMISSIBLE_CORS_ORIGINS: http://localhost:3000
      DISMISSIBLE_CORS_METHODS: GET,POST,DELETE,OPTIONS
      DISMISSIBLE_CORS_ALLOWED_HEADERS: Content-Type,Authorization,x-request-id
      DISMISSIBLE_CORS_CREDENTIALS: true
      DISMISSIBLE_CORS_MAX_AGE: 86400
    ports:
      - '3001:3001'

  dismissible-postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dismissible
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  dismissible-dynamodb:
    image: amazon/dynamodb-local:3.3.1
    restart: unless-stopped
    command: -jar DynamoDBLocal.jar -inMemory -sharedDb -port 4566
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --output /dev/null http://localhost:4566/']
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
    networks:
      - default

  dismissible-redis:
    image: redis:latest
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

networks:
  default:

volumes:
  postgres_data:
  redis_data:
